name: PR gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.18.0
  NODE_VERSION: "22"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  # Covers workspace packages including packages/ui/src/components/particles/** via Vitest include.
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

  # Nest API (@pack-challenge/api) — Vitest + typecheck against ephemeral Postgres (#73).
  # Mark `api` required on main so M10 Resources regressions fail the gate.
  api:
    name: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pack
          POSTGRES_PASSWORD: pack_ci_change_me
          POSTGRES_DB: pack_challenge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pack -d pack_challenge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pack:pack_ci_change_me@localhost:5432/pack_challenge
      FILE_STORAGE_ROOT: ${{ github.workspace }}/var/file-store-ci
      API_PORT: "3000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply resources migration
        run: pnpm --filter @pack-challenge/api db:migrate

      - name: API unit + integration tests
        run: pnpm api:test

      - name: API typecheck
        run: pnpm --filter @pack-challenge/api check-types

  # Broken Storybook (missing stories, compile errors) fails this job — mark required on main.
  storybook:
    name: storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm storybook:build

  # Axe via Storybook Vitest + addon-a11y for stories tagged a11y-gate (atoms+) — mark required on main.
  a11y:
    name: a11y
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @pack-challenge/ui exec playwright install chromium --with-deps

      - name: Axe accessibility (a11y-gate stories)
        run: pnpm a11y

  # Page-level integration specs under packages/ui/src/components/pages/** — mark required on main.
  # Stub failure fails this job (`pnpm integration`) — see packages/ui/INTEGRATION.md.
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pages integration
        run: pnpm integration

  tokens:
    name: tokens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tokens + emit theme
        run: pnpm tokens:check

  # @pack-challenge/ui allowlist + export map + pack/publish dry-run — mark required on main.
  # Broken allowlist / export paths fail this job (`pnpm consumer-contract`) —
  # see packages/ui/CONSUMER_CONTRACT.md and packages/ui/PUBLIC_API.md (#62 / #63).
  consumer-contract:
    name: consumer-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export map + publish dry-run
        run: pnpm consumer-contract

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail threshold: high (and critical). Moderate/low are reported but do not fail the job.
      - name: Dependency audit
        run: |
          {
            echo "## pnpm audit"
            echo ""
            echo "Fail threshold: **high** (\`pnpm audit --audit-level=high\`)."
            echo "Moderate and low advisories are listed when present but do not fail the gate."
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          set +e
          pnpm audit --audit-level=high 2>&1 | tee /tmp/pnpm-audit.txt
          status=${PIPESTATUS[0]}
          set -e

          cat /tmp/pnpm-audit.txt >> "$GITHUB_STEP_SUMMARY"

          {
            echo '```'
            echo ""
            if [ "$status" -eq 0 ]; then
              echo "✅ No high/critical advisories at the documented threshold."
            else
              echo "❌ Audit failed at high/critical threshold (exit \`$status\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"
