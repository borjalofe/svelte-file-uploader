name: PR gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.18.0
  NODE_VERSION: "22"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  # Covers workspace packages including packages/ui/src/components/particles/** via Vitest include.
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

  # Broken Storybook (missing stories, compile errors) fails this job — mark required on main.
  storybook:
    name: storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm storybook:build

  # Axe via Storybook Vitest + addon-a11y for stories tagged a11y-gate (atoms+) — mark required on main.
  a11y:
    name: a11y
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @pack-challenge/ui exec playwright install chromium --with-deps

      - name: Axe accessibility (a11y-gate stories)
        run: pnpm a11y

  # Page-level integration specs under packages/ui/src/components/pages/** — mark required on main.
  # Stub failure fails this job (`pnpm integration`) — see packages/ui/INTEGRATION.md.
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pages integration
        run: pnpm integration

  # Public export allowlist + publish dry-run for @pack-challenge/ui — mark required on main.
  # See packages/ui/PUBLIC_API.md (#63).
  exports:
    name: exports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Public export surface
        run: pnpm exports:check

      - name: Publish dry-run
        run: pnpm publish:dry-run

  tokens:
    name: tokens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tokens + emit theme
        run: pnpm tokens:check

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail threshold: high (and critical). Moderate/low are reported but do not fail the job.
      - name: Dependency audit
        run: |
          {
            echo "## pnpm audit"
            echo ""
            echo "Fail threshold: **high** (\`pnpm audit --audit-level=high\`)."
            echo "Moderate and low advisories are listed when present but do not fail the gate."
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          set +e
          pnpm audit --audit-level=high 2>&1 | tee /tmp/pnpm-audit.txt
          status=${PIPESTATUS[0]}
          set -e

          cat /tmp/pnpm-audit.txt >> "$GITHUB_STEP_SUMMARY"

          {
            echo '```'
            echo ""
            if [ "$status" -eq 0 ]; then
              echo "✅ No high/critical advisories at the documented threshold."
            else
              echo "❌ Audit failed at high/critical threshold (exit \`$status\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"
