# Independent of the PR gate — continuous vuln visibility on a schedule.
name: Daily audit

on:
  schedule:
    # 06:00 UTC every day
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: daily-audit-${{ github.workflow }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.18.0
  NODE_VERSION: "22"

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same fail threshold as PR gate: high (and critical).
      - name: Dependency audit
        run: |
          {
            echo "## Daily pnpm audit"
            echo ""
            echo "Trigger: \`${{ github.event_name }}\`"
            echo "Fail threshold: **high** (\`pnpm audit --audit-level=high\`)."
            echo "This workflow does **not** replace the PR gate \`audit\` job."
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          set +e
          pnpm audit --audit-level=high 2>&1 | tee /tmp/pnpm-audit.txt
          status=${PIPESTATUS[0]}
          set -e

          cat /tmp/pnpm-audit.txt >> "$GITHUB_STEP_SUMMARY"

          {
            echo '```'
            echo ""
            if [ "$status" -eq 0 ]; then
              echo "✅ No high/critical advisories at the documented threshold."
            else
              echo "❌ Audit failed at high/critical threshold (exit \`$status\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"
