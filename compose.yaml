# Full local stack for Pack evaluators (M12): Postgres + Nest API + SvelteKit web.
# Evaluator path: cp .env.example .env && docker compose up --build

name: pack-challenge

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pack

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # In-compose hostname is the Compose service name `db` (ADR 0002).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_PORT: ${API_PORT:-3000}
      FILE_STORAGE_ROOT: /data/file-store
      NODE_ENV: production
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - api_files:/data/file-store
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.API_PORT||3000)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - pack

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Browser on the host must reach published API port (not Docker DNS `api`).
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      WEB_PORT: ${WEB_PORT:-5173}
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pack

volumes:
  postgres_data:
  api_files:

networks:
  pack:
    driver: bridge
